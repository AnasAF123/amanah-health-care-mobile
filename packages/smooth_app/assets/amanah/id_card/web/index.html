<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>RS Amanah - 3D Doctor ID Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: transparent;
      touch-action: none;
    }

    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #root > main {
      width: 100vw;
      height: 100vh;
    }

    .relative {
      position: relative;
    }

    .absolute {
      position: absolute;
    }

    .w-screen {
      width: 100vw;
    }

    .h-screen {
      height: 100vh;
    }

    .w-full {
      width: 100%;
    }

    .h-full {
      height: 100%;
    }

    .overflow-hidden {
      overflow: hidden;
    }

    .select-none {
      user-select: none;
      -webkit-user-select: none;
    }

    .touch-none {
      touch-action: none;
    }

    .overscroll-none {
      overscroll-behavior: none;
    }

    .flex {
      display: flex;
    }

    .items-center {
      align-items: center;
    }

    .justify-center {
      justify-content: center;
    }

    .pointer-events-none {
      pointer-events: none;
    }

    .top-1\/3 {
      top: 33.333333%;
    }

    .left-1\/2 {
      left: 50%;
    }

    .-translate-x-1\/2 {
      transform: translateX(-50%);
    }

    .-translate-y-1\/2 {
      transform: translateY(-50%);
    }

    .-translate-x-1\/2.-translate-y-1\/2 {
      transform: translate(-50%, -50%);
    }

    .w-\[340px\] {
      width: 340px;
    }

    .h-\[340px\] {
      height: 340px;
    }

    .rounded-full {
      border-radius: 9999px;
    }

    .filter {
      filter: var(--tw-blur, none);
    }

    .blur-\[100px\] {
      --tw-blur: blur(100px);
    }

    .bg-blue-400\/25 {
      background-color: rgb(96 165 250 / 0.25);
    }

    .bg-cyan-500\/20 {
      background-color: rgb(6 182 212 / 0.20);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
